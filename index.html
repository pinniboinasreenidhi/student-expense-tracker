<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Student Expense Tracker</h1>
      <p>Track your daily spending simply and clearly.</p>
    </header>

    <section class="summary">
      <div class="card">
        <span>Total Expenses</span>
        <strong id="totalExpense">₹0.00</strong>
      </div>
      <div class="card">
        <span>Number of Expenses</span>
        <strong id="expenseCount">0</strong>
      </div>
    </section>

    <section class="form-card">
      <h2>Add Expense</h2>
      <form id="expenseForm">
        <div class="form-grid">
          <div>
            <label for="description">Description</label>
            <input id="description" type="text" placeholder="e.g. Lunch" required>
          </div>
          <div>
            <label for="amount">Amount (₹)</label>
            <input id="amount" type="number" min="0.01" step="0.01" placeholder="e.g. 120" required>
          </div>
          <div>
            <label for="category">Category</label>
            <select id="category" required>
              <option value="Food">Food</option>
              <option value="Travel">Travel</option>
              <option value="Education">Education</option>
              <option value="Shopping">Shopping</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div>
            <label for="date">Date</label>
            <input id="date" type="date" required>
          </div>
        </div>
        <button type="submit">Add Expense</button>
      </form>
    </section>

    <section class="list-card">
      <div class="list-header">
        <h2>My Expenses</h2>
        <select id="filterCategory">
          <option value="All">All Categories</option>
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Education">Education</option>
          <option value="Shopping">Shopping</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div id="expenseList" class="expense-list"></div>
      <p id="emptyMessage" class="empty">No expenses added yet.</p>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
